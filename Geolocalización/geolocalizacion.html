<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geolocalizacion RF02</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            margin-top: 40px;
        }
        .contenedor {
            background-color: white;
            border: 1px solid #ccc;
            padding: 20px;
            width: 70%;
            margin: 0 auto;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            background-color: #1f6f5b;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        #mensaje {
            margin-top: 15px;
            font-weight: bold;
        }
        #mapa {
            margin-top: 20px;
            width: 100%;
            height: 350px;
            background-color: #eaeaea;
            border: 1px solid #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h2>Modulo de Geolocalizacion (RF02)</h2>
        <p>Rastreo de unidad en tiempo real</p>
        
        <button onclick="obtenerUbicacion()">Obtener mi ubicacion</button>
        
        <div id="mensaje"></div>
        
        <div id="mapa">
            El mapa cargara aqui...
        </div>
    </div>

    <script>
        function obtenerUbicacion() {
            let divMensaje = document.getElementById("mensaje");

            if (navigator.geolocation) {
                divMensaje.innerHTML = "Buscando ubicacion...";
                navigator.geolocation.getCurrentPosition(mostrarPosicion, mostrarError);
            } else {
                divMensaje.innerHTML = "El navegador no soporta la geolocalizacion.";
            }
        }

        function mostrarPosicion(posicion) {
            let latitud = posicion.coords.latitude;
            let longitud = posicion.coords.longitude;
            let divMensaje = document.getElementById("mensaje");
            let divMapa = document.getElementById("mapa");

            divMensaje.innerHTML = "Latitud: " + latitud + " | Longitud: " + longitud;

            let urlMapa = "https://www.openstreetmap.org/export/embed.html?bbox=" + 
                          (longitud - 0.01) + "%2C" + (latitud - 0.01) + "%2C" + 
                          (longitud + 0.01) + "%2C" + (latitud + 0.01) + 
                          "&layer=mapnik&marker=" + latitud + "%2C" + longitud;

            divMapa.innerHTML = "<iframe width='100%' height='100%' frameborder='0' src='" + urlMapa + "'></iframe>";
        }

        function mostrarError(error) {
            let divMensaje = document.getElementById("mensaje");
            
            if (error.code == 1) {
                divMensaje.innerHTML = "Error: Permiso denegado por el usuario.";
            } else if (error.code == 2) {
                divMensaje.innerHTML = "Error: Posicion no disponible.";
            } else if (error.code == 3) {
                divMensaje.innerHTML = "Error: Tiempo de espera agotado.";
            } else {
                divMensaje.innerHTML = "Error desconocido.";
            }
        }
    </script>
</body>
</html>
